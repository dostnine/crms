        </table>`;

    // Team blocks (office + names) sit two to a row; single people stack.
    const staffHTML = (persons) => {
        const grid = persons.length > 2 && persons.some((g) => g.names);
        return `<div class="staff${grid ? ' is-grid' : ''}">${persons.map((g) => `
        <div class="staff-group">${g.office ? `<b>${esc(g.office)}</b>` : ''}${[].concat(g.lead || []).map((l) => `<strong>${esc(l)}</strong>`).join('')}${g.role ? `<span>${esc(g.role)}</span>` : ''}${(g.names || []).map((n) => `<span>${esc(n)}</span>`).join('')}${g.cos && g.cos.length ? `<em>(COS: ${g.cos.map(esc).join(', ')})</em>` : ''}</div>`).join('')}</div>`;
    };

    // Free-form steps table, for services printed differently from the
    // step/row layout. `cols` are [width %, kind]; each row lists its cells
    // in column order: text, or { t | h | staff } with an optional `span`
    // (rows covered), or null where a cell above already covers the slot.
    // A spanning cell cut by a page break is repeated if it is short
    // (fees, time, or `repeat`), otherwise it points back to the page before.
    const gridTable = (grid, from = 0, to, withTotal) => {
        const end = to ?? grid.rows.length;
        const kinds = { client: 'svc-client', c: 'is-c' };
        const show = (o) => (o.staff ? staffHTML(o.staff) : rich(o));
        const cols = grid.cols.map(() => []);
        grid.rows.forEach((row, r) => row.forEach((cell, c) => {
            if (cell == null) return;
            const o = typeof cell === 'object' ? cell : { t: cell };
            cols[c].push({ start: r, end: Math.min(r + (o.span || 1), grid.rows.length), cell: o });
        }));
        const body = [];
        for (let r = from; r < end; r++) {
            body.push(`<tr>${cols.map((cells, c) => {
                const hit = cells.find((x) => r >= x.start && r < x.end);
                if (!hit) return '<td></td>';
                if (r !== hit.start && r !== from) return '';
                const kind = grid.cols[c][1];
                const span = Math.min(hit.end, end) - r;
                // a cell that started on the previous page
                const carried = r !== hit.start;
                const inner = !carried ? show(hit.cell)
                    : kind === 'client' ? `${show(hit.cell)} <i class="svc-more">(continued)</i>`
                    : kind === 'c' || hit.cell.repeat ? show(hit.cell)
                    : '<i class="svc-more">As indicated on the previous page</i>';
                return `<td class="${kinds[kind] || ''}"${span > 1 ? ` rowspan="${span}"` : ''}>${inner}</td>`;
            }).join('')}</tr>`);
        }
        const totalCell = (t) => (typeof t === 'object'
            ? `<td class="${t.cls || 'is-c'}"${t.colspan ? ` colspan="${t.colspan}"` : ''}>${rich(t)}</td>`
            : `<td class="is-c">${esc(t)}</td>`);
        return `
        <table class="svc-steps is-grid">
            <colgroup>${grid.cols.map(([w]) => `<col style="width:${w}%">`).join('')}</colgroup>
            <thead><tr>${grid.head.map((h) => (typeof h === 'object' ? `<th colspan="${h.colspan}">${rich(h)}</th>` : `<th>${esc(h)}</th>`)).join('')}</tr></thead>
            <tbody>
                ${body.join('')}
                ${withTotal && grid.total ? `<tr class="svc-total">${grid.total.map(totalCell).join('')}</tr>` : ''}
            </tbody>
        </table>`;
    };

    // The "Person responsible" cells of a step: persons on the step cover
    // every row; persons on a row cover `span` rows (default 1).
    const personCells = (st) => {
        const n = st.rows.length;
        if (st.persons) return [{ start: 0, end: n, persons: st.persons }];
        const cells = [];
        for (let r = 0; r < n;) {
            const span = Math.min(st.rows[r].span || 1, n - r);
            cells.push({ start: r, end: r + span, persons: st.rows[r].persons || [] });
            r += span;
        }
        return cells;
    };

    const stepsTable = (doc, idxs, withTotal) => `
        <table class="svc-steps">
            <colgroup>${['client', 'action', 'fee', 'time', 'person'].map((c, n) => `<col class="c-${c}"${doc.cols ? ` style="width:${doc.cols[n]}%"` : ''}>`).join('')}</colgroup>
            <thead><tr><th>Client steps</th><th>Agency actions</th><th>Fees to be paid</th><th>Processing time${doc.plainTime ? '' : ' <i>(Working days)</i>'}</th><th>Person responsible</th></tr></thead>
            <tbody>
                ${idxs.map((spec) => {
                    const [i, from = 0, to] = Array.isArray(spec) ? spec : [spec];
                    const st = doc.steps[i];
                    const end = to ?? st.rows.length;
                    const shown = end - from;
                    const cells = personCells(st);
                    return st.rows.slice(from, end).map((row, k) => {
                        const r = from + k;
                        const cell = cells.find((c) => r >= c.start && r < c.end);
                        const opens = r === cell.start || k === 0;
                        return `<tr class="${k === 0 ? 'is-first' : 'is-cont'}">
                        ${k === 0 ? `<td class="svc-client" rowspan="${shown}"><span class="svc-n">${st.mark ?? `${st.num ?? i + 1}.`}</span>${st.client}${from > 0 ? ' <i class="svc-more">(continued)</i>' : ''}</td>` : ''}
                        <td>${row.acts.map(([n, t, depth]) => (depth === 'label'
                            ? `<div class="svc-act is-label">${rich(t)}</div>`
                            : `<div class="svc-act${depth ? ' is-sub' : ''}"><span class="svc-n">${n}</span><span>${rich(t)}</span></div>`)).join('')}</td>
                        ${k === 0 ? `<td class="is-c" rowspan="${shown}">${esc(st.fees)}</td>` : ''}
                        <td class="is-c svc-time">${esc(row.time).replace(' ', '&nbsp;')}</td>
                        ${opens ? `<td rowspan="${Math.min(cell.end, end) - r}">${r === cell.start ? staffHTML(cell.persons) : '<i class="svc-more">As indicated on the previous page</i>'}</td>` : ''}
                    </tr>`;
                    }).join('');
                }).join('')}
                ${withTotal && doc.total ? `<tr class="svc-total"><td colspan="2"></td><td class="is-c">Total</td><td class="is-c">${esc(doc.total)}</td><td></td></tr>` : ''}
            </tbody>
        </table>`;

    // ------------------------------------------------------------------
    // Pages, and the side menu entries that point at them
    // ------------------------------------------------------------------
    const { PAGES, NAV } = (() => {
        const list = [];
        const nav = [];
        // Adds a menu entry for the page that is pushed next.
        const mark = (level, title, num = '') => nav.push({ level, title, num, page: list.length });

        mark(0, 'Cover');
        list.push({ type: 'cover' });
        // The inside of the front cover carries a copy of the cover, so the
        // first page of the charter opens on the right-hand side.
        list.push({ type: 'inside', of: 'cover' });
        mark(0, 'Mandate, Mission & Vision');
        list.push({ type: 'about', part: 1 });
        mark(0, 'Service Pledge');
        list.push({ type: 'about', part: 2 });
        mark(0, 'List of Services');
        list.push({ type: 'services', part: 1 });
        list.push({ type: 'services', part: 2 });

        // ['check', from, to] / ['grid', from, to] in a page spec -> [from, to]
        const blockOf = (spec, name) => {
            const hit = spec.find((x) => Array.isArray(x) && x[0] === name);
            return hit ? hit.slice(1) : null;
        };
        let group = '';
        CHARTER_DOCS.forEach((office) => {
            if (office.group !== group) {
                group = office.group;
                nav.push({ group: true, title: group });
            }
            // Every office opens on a page of its own, as in the printed charter.
            mark(0, office.office);
            list.push({ type: 'office', office: office.office, group: office.group, programs: office.programs });
            office.programs.forEach((program) => {
                // A "solo" program is itself the service (no a/b/c parts),
                // so it has no program page and no sub-entries.
                mark(1, program.name, program.num);
                if (!program.solo) list.push({ type: 'program', office: office.office, group: office.group, program });
                program.services.forEach((doc) => {
                    if (!program.solo) mark(2, doc.title, doc.code);
                    doc.pages.forEach((spec, part) => {
                        list.push({
                            type: 'svc', office: office.office, group: office.group, program, doc, part,
                            info: spec.includes('info'),
                            check: blockOf(spec, 'check') || (spec.includes('info') && doc.checklist && !doc.pages.some((pg) => blockOf(pg, 'check')) ? [] : null),
                            grid: blockOf(spec, 'grid'),
                            idxs: spec.filter((x) => typeof x === 'number' || (Array.isArray(x) && typeof x[0] === 'number')),
                            lastPart: part === doc.pages.length - 1,
                        });
                    });
                });
            });
        });

        nav.push({ group: true, title: 'Feedback and Contacts' });
        FEEDBACK.pages.forEach((spec, part) => {
            if (part === 0) mark(0, 'Feedback and Complaints Mechanism');
            if (spec.includes('offices')) mark(0, 'List of Offices');
            list.push({ type: 'fcm', part, rows: spec.filter((x) => typeof x === 'number'), offices: spec.includes('offices') });
        });
        mark(0, 'Tell us how we did');
        list.push({ type: 'feedback' });

        // The book ends with the inside of the back cover and the back cover
        // itself, the two sides of the last leaf, so the pages before them
        // must come to an even count.
        if (list.length % 2 === 1) list.push({ type: 'blank' });
        list.push({ type: 'inside', of: 'back' });
        list.push({ type: 'back' });
        // `index` is a page's place in the book; `number` is the page number
        // printed on it. The insides of the covers carry no number.
        let number = 0;
        list.forEach((pg, i) => { pg.index = i; pg.number = pg.type === 'inside' ? null : number++; });
        return { PAGES: list, NAV: nav };
    })();
    const LAST = PAGES.length - 1;
    const LAST_NUMBER = PAGES[LAST].number;
    // A screen that shows one page at a time leaves out the insides of the
    // covers, which only repeat the covers.
    const SINGLE = PAGES.filter((pg) => pg.type !== 'inside');

    const runHead = (p, side) => {
        const where = p.type === 'services' ? 'List of Services'
            : p.type === 'program' || p.type === 'svc' || p.type === 'office' ? p.office
            : p.type === 'fcm' ? 'Feedback and Complaints' : 'DOST IX';
        return side === 'right'
            ? `<div class="run"><span>Citizen's Charter</span><span>${esc(where)}</span></div>`
            : `<div class="run"><span>${esc(where)}</span><span>Region IX</span></div>`;
    };
    const furniture = (p, side) => `
        ${runHead(p, side)}
        <span class="ruler on-${side}"></span>
        <span class="folio on-${side}">${pad(p.number)} / ${pad(LAST_NUMBER)}</span>`;

    // The cover art. Each cover is printed twice: outside, with a hint to
    // open or close the book, and again on its inside.
    const frontCover = (outside) => `
            <div class="pg pg-cover"${outside ? '' : ' aria-hidden="true"'}>
                <div class="holo"></div>
                <div class="seal"><img src="assets/dost-logo.png" alt="DOST logo"></div>
                <p class="cover-dept">Department of Science and Technology</p>
                <p class="cover-office">Regional Office IX</p>
                <div class="cover-gap"></div>
                <h1 class="cover-title">Citizen's<br>Charter</h1>
                <p class="cover-edition">2026 (1st Edition)</p>
                ${outside ? `<p class="cover-hint">${svg(ICON.open)} Tap or swipe to open</p>` : ''}
            </div>`;
    const backCover = (outside) => `
            <div class="pg pg-cover"${outside ? '' : ' aria-hidden="true"'}>
                <div class="holo"></div>
                <div class="seal is-small"><img src="assets/dost-logo.png" alt="DOST logo"></div>
                <p class="cover-kicker">Department of Science and Technology</p>
                <p class="back-office">Regional Office IX</p>
                <p class="cover-region">Zamboanga Peninsula</p>
                <p class="back-thanks">Thank you for visiting</p>
                ${outside ? `<p class="cover-hint">${svg(ICON.close)} Tap or swipe to close</p>` : ''}
            </div>`;

    function pageHTML(p, side) {
        switch (p.type) {
        case 'cover':
            return frontCover(true);

        case 'inside':
            return p.of === 'cover' ? frontCover(false) : backCover(false);

        case 'about':
            if (p.part === 1) return `
            <div class="pg">
                ${furniture(p, side)}
                <p class="kicker">DOST Region IX</p>
                <h2 class="title">Who we are</h2>
                <div class="rule"></div>
                <section class="tenet">
                    <h3><span>01</span>Mandate</h3>
                    <p>The Department of Science and Technology (DOST) shall provide central direction,
                    leadership, and coordination of scientific and technological efforts and ensure that the
                    results therefrom are geared and utilized in areas of maximum economic and social
                    benefits for the people.</p>
                </section>
                <section class="tenet">
                    <h3><span>02</span>Mission (2026)</h3>
                    <p class="tenet-lead">Advances Science, Technology, and Innovation for a Sustainable and Inclusive Development.</p>
                </section>
                <section class="tenet">
                    <h3><span>03</span>Vision</h3>
                    <p class="tenet-lead">The forefront of scientific, technological, and innovative solutions for the growth and
                    ultimate satisfaction of the society.</p>
                </section>
            </div>`;
            return `
            <div class="pg">
                ${furniture(p, side)}
                <section class="tenet">
                    <h3><span>04</span>Service Pledge</h3>
                    <p class="tenet-note">Quality Policy (Rev. 12, 1 August 2025)</p>
                    <p>We are committed to make a significant difference in Region IX that addresses
                    the needs and expectations of the customers and other interested parties
                    based on all applicable regulatory and statutory requirement by:</p>
                    <ul class="pledge">
                        <li>providing quality and relevant scientific, technological, and innovative (STI) programs and services;</li>
                        <li>advancing an inclusive, smart and sustainable STI development <em>through gender responsive STI interventions;</em></li>
                        <li>empowering communities through appropriate STI interventions;</li>
                        <li>strengthening partnerships in STI initiatives;</li>
                        <li>sustaining an effective service continuity management practices;</li>
                        <li>improving the effectiveness and efficiency of the working environment and the work processes of our operations; and</li>
                        <li>managing potential risks and opportunities that may affect the implementation of our Quality Management System.</li>
                    </ul>
                    <p class="tenet-note tenet-sub">Quality Objectives (Rev. 6, 1 August 2025)</p>
                    <ol class="objectives">
                        <li>To continually improve the DOST IX Quality Management System (QMS) and achieve a satisfactory rating from at least 95% of customers surveyed.</li>
                        <li>To deliver quality and relevant STI programs and services according to mutually agreed terms and conditions and applicable statutory and regulatory requirements.</li>
                    </ol>
                </section>
            </div>`;

        case 'services':
            return `
            <div class="pg">
                ${furniture(p, side)}
                ${p.part === 1 ? `
                <p class="kicker">Citizen's Charter 2026</p>
                <h2 class="title">List of Services</h2>
                <div class="rule"></div>` : ''}
                <div class="ls-head"><span>Service/Office</span><span>Page</span></div>
                ${(p.part === 1
                    ? [{ ...SERVICE_LIST[0], items: SERVICE_LIST[0].items.slice(0, 5) }]
                    : [{ items: SERVICE_LIST[0].items.slice(5) }, ...SERVICE_LIST.slice(1)]).map(listBlock).join('')}
            </div>`;

        case 'office':
            return `
            <div class="pg pg-section">
                ${furniture(p, side)}
                <p class="kicker">${esc(p.group)}</p>
                <h2 class="title sec-title">${esc(p.office)}</h2>
                <div class="rule"></div>
                <p class="label">Services of this office</p>
                <ol class="prog-list">
                    ${p.programs.map((g) => `<li><span>${esc(g.num)}</span>${esc(g.name)}</li>`).join('')}
                </ol>
            </div>`;

        case 'program':
            return `
            <div class="pg pg-section${[].concat(p.program.about || []).join('').length > 400 ? ' is-dense' : ''}">
                ${furniture(p, side)}
                <p class="kicker">${esc(p.office)}</p>
                <div class="prog">
                    <span class="prog-num">${esc(p.program.num)}</span>
                    <div class="prog-text">
                        <h3 class="prog-name">${esc(p.program.name)}</h3>
                        ${[].concat(p.program.about || []).map((t) => `<p class="prog-about">${esc(t)}</p>`).join('')}
                    </div>
                </div>
                <p class="label">Services under this program</p>
                <ol class="prog-list">
                    ${p.program.services.map((d) => `<li><span>${esc(d.code)}</span>${esc(d.title)}</li>`).join('')}
                </ol>
            </div>`;

        case 'svc': {
            const d = p.doc;
            return `
            <div class="pg pg-svc">
                ${furniture(p, side)}
                ${p.info ? `
                <p class="svc-prog">${p.program.solo ? esc(p.group) : `${esc(p.program.num)} ${esc(p.program.name)}`}</p>
                <h2 class="svc-title${d.title.length > 60 ? ' is-long' : ''}"><span>${esc(d.code)}</span>${esc(d.title)}</h2>
                ${d.about ? `<p class="svc-about">${esc(d.about)}</p>` : ''}
                ${d.info ? `<dl class="svc-info">
                    ${d.info.map(([k, v]) => `<dt>${esc(k)}:</dt><dd${v && v.flush ? ' class="is-flush"' : ''}>${rich(v)}</dd>`).join('')}
                </dl>` : ''}` : `
                <p class="svc-prog">${esc(d.code)} ${esc(d.title)} <i>(continued)</i></p>`}
                ${p.check ? checkTable(d.checklist, p.check[0], p.check[1]) : ''}
                ${p.idxs.length ? stepsTable(d, p.idxs, p.lastPart) : ''}
                ${p.grid ? gridTable(d.grid, p.grid[0], p.grid[1], p.lastPart) : ''}
            </div>`;
        }

        case 'fcm':
            return `
            <div class="pg pg-svc pg-fcm">
                ${furniture(p, side)}
                ${p.part === 0 ? `
                <p class="svc-prog">Citizen's Charter 2026</p>
                <h2 class="svc-title">Feedback and Complaints Mechanism</h2>` : `
                <p class="svc-prog">Feedback and Complaints Mechanism <i>(continued)</i></p>`}
                ${p.rows.length ? `<table class="fcm"><tbody>${p.rows.map((r) => `<tr><td class="fcm-q">${esc(FEEDBACK.rows[r][0])}</td><td>${rich(FEEDBACK.rows[r][1])}</td></tr>`).join('')}</tbody></table>` : ''}
                ${p.offices ? `
                <h3 class="fcm-sub">List of Offices</h3>
                <table class="fcm-offices">
                    <thead><tr><th>Office</th><th>Address</th><th>Contact information</th></tr></thead>
                    <tbody>${FEEDBACK.offices.map(([office, address, phones, email]) => `<tr><td class="fcm-q">${esc(office)}</td><td>${esc(address)}</td><td>${phones.map(esc).join('<br>')}<br>${link(email)}</td></tr>`).join('')}</tbody>
                </table>` : ''}
            </div>`;

        case 'feedback':
            return `
            <div class="pg pg-center">
                ${furniture(p, side)}
                <span class="orb">${svg(ICON.chat)}</span>
                <p class="kicker">Customer Satisfaction Feedback</p>
                <h2 class="title">Tell us how we did</h2>
                <div class="rule"></div>
                <p class="body">
                    Your ratings and comments help DOST Region IX improve the way we serve you.
                    It only takes a few minutes.
                </p>
                <p class="counter">Ask for the CSF form at the counter after your transaction</p>
            </div>`;

        case 'blank':
            return `<div class="pg pg-verso">${furniture(p, side)}</div>`;

        case 'verso':
            return '<div class="pg pg-verso"></div>';

        default: // back cover
            return backCover(true);
        }
    }

    const describe = (p) => {
        if (!p) return '';
        switch (p.type) {
        case 'cover': return 'Cover';
        case 'inside': return p.of === 'cover' ? 'Cover' : 'Back cover';
        case 'about': return p.part === 1 ? 'Mandate, Mission & Vision' : 'Service Pledge';
        case 'services': return 'List of Services';
        case 'office': return p.office;
        case 'fcm': return 'Feedback and Complaints Mechanism';
        case 'program': return `${p.program.num} ${p.program.name}`;
        case 'svc': return p.program.solo || /^\d/.test(p.doc.code) ? `${p.doc.code} ${p.doc.title}` : `${p.program.num.replace('.', '')}${p.doc.code} ${p.doc.title}`;
        case 'feedback': return 'Tell us how we did';
        case 'back': return 'Back cover';
        default: return 'Notes';
        }
    };

    // ------------------------------------------------------------------
    // Book state
    // ------------------------------------------------------------------
    const $ = (id) => document.getElementById(id);
    const stage = $('stage');
    const wrap = $('book-wrap');
    const book = $('book');

    let mode = null;        // 'spread' (two pages) or 'single' (portrait kiosks, phones)
    let leaves = [];
    let current = 0;        // number of leaves turned over
    let pending = 0;        // queued page turns from a multi-page jump
    const turning = new Map();

    const maxCurrent = () => (mode === 'spread' ? leaves.length : leaves.length - 1);

    // The page that best represents what is on screen, used to keep your
    // place when the layout switches between spread and single page.
    const focusPage = () => {
        if (mode === 'single') return SINGLE[current].index;
        if (current === 0) return 0;
        return Math.min(current * 2 - 1, LAST);
    };
    const leafForPage = (page) => (mode === 'spread'
        ? Math.ceil(page / 2)
        : Math.max(0, SINGLE.findIndex((pg) => pg.index >= page)));

    function render() {
        leaves = mode === 'spread'
            ? Array.from({ length: PAGES.length / 2 }, (_, i) => ({ front: PAGES[i * 2], back: PAGES[i * 2 + 1] }))
            : SINGLE.map((p) => ({ front: p, back: { type: 'verso', number: p.number } }));

        // In the light version every leaf starts empty; update() puts in the open pages.
        book.innerHTML = '<div class="depth depth-l"></div><div class="depth depth-r"></div>' + leaves.map((leaf, i) => `
            <div class="leaf" data-i="${i}">
                <div class="face front">${lite ? '' : pageHTML(leaf.front, 'right')}</div>
                <div class="face back">${lite ? '' : pageHTML(leaf.back, 'left')}</div>
            </div>`).join('');
        update();
    }

    // Light version: a page is in the document only while it is on screen.
    const putPage = (face, show, page, side) => {
        if (show !== Boolean(face.firstChild)) face.innerHTML = show ? pageHTML(page, side) : '';
    };

    function update() {
        const n = leaves.length;
        // Draw only the open spread, the leaves in the air, and one leaf
        // beneath them on each side (what a turning page uncovers).
        const inAir = [...turning.keys()];
        const firstDrawn = Math.min(current - 1, ...inAir) - 1;
        const lastDrawn = Math.max(current, ...inAir) + 1;
        book.querySelectorAll('.leaf').forEach((el, i) => {
            const flipped = i < current;
            el.classList.toggle('flipped', flipped);
            el.classList.toggle('is-away', i < firstDrawn || i > lastDrawn);
            const dir = turning.get(i);
            el.classList.toggle('turning', Boolean(dir));
            el.style.zIndex = dir
                ? 3 * n + (dir === 'fwd' ? i : n - i)
                : (flipped ? n + i : n - i);

            // Only the faces actually on screen are reachable by touch or keyboard.
            const frontVisible = i === current;
            const backVisible = mode === 'spread' && i === current - 1;
            const [front, back] = el.children;
            front.inert = !frontVisible;
            back.inert = !backVisible;
            front.classList.toggle('is-shown', frontVisible);
            back.classList.toggle('is-shown', backVisible);
            if (lite) {
                putPage(front, frontVisible, leaves[i].front, 'right');
                putPage(back, backVisible, leaves[i].back, 'left');
            }
        });

        const atStart = current === 0;
        const atEnd = mode === 'spread' && current === n;
        const shift = mode === 'single' ? -25 : atStart ? -25 : atEnd ? 25 : 0;
        wrap.style.transform = `translateX(${shift}%)`;
        wrap.classList.toggle('is-single', mode === 'single');
        wrap.classList.toggle('is-closed-front', mode === 'spread' && atStart);
        wrap.classList.toggle('is-closed-back', atEnd);
        wrap.style.setProperty('--ld', (current / n).toFixed(3));
        wrap.style.setProperty('--rd', ((n - current) / n).toFixed(3));

        // dock
        let title;
        let sub;
        if (mode === 'single') {
            const p = SINGLE[current];
            title = describe(p);
            sub = p.type === 'cover' || p.type === 'back' ? '' : `Page ${pad(p.number)} of ${pad(LAST_NUMBER)}`;
        } else if (atStart) {
            title = 'Cover';
            sub = '';
        } else if (atEnd) {
            title = 'Back cover';
            sub = '';
        } else {
            const left = PAGES[current * 2 - 1];
            const right = PAGES[current * 2];
            // the inside of a cover has no page number or title of its own
            const numbered = [left, right].filter((pg) => pg.number != null);
            title = describe(numbered[numbered.length - 1]);
            sub = numbered.length === 2
                ? `Pages ${pad(left.number)}–${pad(right.number)} of ${pad(LAST_NUMBER)}`
                : `Page ${pad(numbered[0].number)} of ${pad(LAST_NUMBER)}`;
        }
        $('meter-title').textContent = title;
        $('meter-sub').textContent = sub;
        $('meter-fill').style.width = `${(current / maxCurrent()) * 100}%`;
        $('prev-btn').disabled = current === 0;
        $('next-btn').disabled = current >= maxCurrent();
    }

    // A jump of more than a few leaves (from the side menu, or back to the
    // cover) skips ahead unseen and turns only the last ones, so it lands
    // in about a second instead of riffling through the whole book.
    const MAX_RIFFLE = 4;

    // the timers of a jump's page turns, so the Light / 3D switch can stop them
    const stepTimers = [];

    function flipTo(target) {
        target = Math.max(0, Math.min(maxCurrent(), target));
        if (lite) {
            // Light version: nothing turns; the open pages are swapped.
            if (target !== current) {
                current = target;
                update();
            }
            return;
        }
        if (pending > 0 || target === current) return;
        const forward = target > current;
        let steps = Math.abs(target - current);
        if (steps > MAX_RIFFLE) {
            steps = MAX_RIFFLE;
            turning.clear();
            current = target + (forward ? -steps : steps);
            book.classList.add('is-jumping');
            update();
            void book.offsetWidth; // settle the skipped leaves before turning resumes
            book.classList.remove('is-jumping');
        }
        pending = steps;
        stepTimers.length = 0;
        for (let s = 0; s < steps; s++) {
            stepTimers.push(setTimeout(() => {
                const leaf = forward ? current : current - 1;
                // A jump riffles through pages: every turn but the last one
                // gets a short, quieter swish, and only the last one lands.
                pageSound.flip(s < steps - 1);
                turning.set(leaf, forward ? 'fwd' : 'back');
                current += forward ? 1 : -1;
                pending -= 1;
                update();
                setTimeout(() => { turning.delete(leaf); update(); }, FLIP_MS);
            }, reduceMotion ? 0 : s * STEP_MS));
        }
    }
    const next = () => flipTo(current + 1);
    const prev = () => flipTo(current - 1);
    const goToPage = (page) => flipTo(leafForPage(page));

    // ------------------------------------------------------------------
    // Layout: two-page spread on landscape screens, one large page on
    // portrait kiosks and phones, whichever gives the bigger page.
    // ------------------------------------------------------------------
    function layout() {
        const w = stage.clientWidth;
        const h = stage.clientHeight - 24;
        // Pages are a broad 0.9 width-to-height, so the open book fills a
        // landscape kiosk instead of sitting as a narrow A4 spread.
        const spreadPage = Math.min((w * 0.98) / 2, h * PAGE_RATIO);
        const singlePage = Math.min(w * 0.94, h * PAGE_RATIO);
        const nextMode = singlePage > spreadPage * 1.25 ? 'single' : 'spread';
        wrap.style.setProperty('--page-ratio', String(PAGE_RATIO));
        wrap.style.setProperty('--page-w', `${Math.floor(nextMode === 'spread' ? spreadPage : singlePage)}px`);

        if (nextMode !== mode) {
            const page = mode ? focusPage() : 0;
            mode = nextMode;
            current = Math.min(leafForPage(page), mode === 'spread' ? PAGES.length / 2 : SINGLE.length - 1);
            turning.clear();
            render();
        }
    }

    // ------------------------------------------------------------------
    // Input: swipe, tap a side of the book, keyboard, page buttons
    // ------------------------------------------------------------------
    let touchStart = null;
    stage.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button')) return;
        touchStart = { x: e.clientX, y: e.clientY };
    });
    stage.addEventListener('pointercancel', () => { touchStart = null; });
    stage.addEventListener('pointerup', (e) => {
        if (!touchStart) return;
        const dx = e.clientX - touchStart.x;
        const dy = e.clientY - touchStart.y;
        touchStart = null;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
            if (dx < 0) next(); else prev();
            return;
        }
        if (Math.abs(dx) > 12 || Math.abs(dy) > 12) return;

        const rect = wrap.getBoundingClientRect();
        if (mode === 'single') {
            const pageLeft = rect.left + rect.width / 2;
            if (e.clientX < pageLeft + (rect.width / 2) * 0.35) prev(); else next();
        } else if (e.clientX < rect.left + rect.width / 2) {
            prev();
        } else {
            next();
        }
    });

    $('prev-btn').addEventListener('click', prev);
    $('next-btn').addEventListener('click', next);
    $('brand-btn').addEventListener('click', () => flipTo(0));

    // ------------------------------------------------------------------
    // Side menu: the contents of the book, opened from the Contents
    // button. Tapping an entry closes the menu and turns to that page.
    // ------------------------------------------------------------------
    const menu = $('menu');
    const menuList = $('menu-list');
    const contentsBtn = $('contents-btn');
    menuList.innerHTML = NAV.map((n) => (n.group
        ? `<p class="menu-group">${esc(n.title)}</p>`
        : `<button class="menu-item lvl-${n.level}" type="button" data-page="${n.page}">${n.num ? `<span class="menu-num">${esc(n.num)}</span>` : ''}<span class="menu-name">${esc(n.title)}</span><span class="menu-page">${PAGES[n.page].number ? pad(PAGES[n.page].number) : ''}</span></button>`)).join('');

    // Marks the entries whose page is open, or failing that the entry the
    // open pages belong to.
    const paintMenu = () => {
        const shown = (mode === 'single' ? [SINGLE[current].index] : [current * 2 - 1, current * 2]).filter((n) => n >= 0 && n <= LAST);
        const items = [...menuList.querySelectorAll('.menu-item')];
        const here = items.map((el) => shown.includes(Number(el.dataset.page)));
        if (!here.includes(true)) {
            let last = -1;
            items.forEach((el, i) => { if (Number(el.dataset.page) <= shown[0]) last = i; });
            if (last >= 0) here[last] = true;
        }
        items.forEach((el, i) => {
            el.classList.toggle('is-here', here[i]);
            if (here[i]) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current');
        });
    };
    const menuIsOpen = () => document.body.classList.contains('menu-open');
    const setMenu = (open) => {
        if (open === menuIsOpen()) return;
        const hadFocus = menu.contains(document.activeElement);
        document.body.classList.toggle('menu-open', open);
        menu.inert = !open;
        contentsBtn.setAttribute('aria-expanded', String(open));
        if (open) {
            paintMenu();
            const here = menuList.querySelector('.is-here');
            if (here) here.scrollIntoView({ block: 'center' });
            $('menu-close').focus({ preventScroll: true });
        } else if (hadFocus) {
            contentsBtn.focus({ preventScroll: true });
        }
    };
    contentsBtn.addEventListener('click', () => setMenu(!menuIsOpen()));
    $('menu-close').addEventListener('click', () => setMenu(false));
    $('menu-scrim').addEventListener('click', () => setMenu(false));
    menuList.addEventListener('click', (e) => {
        const item = e.target.closest('.menu-item');
        if (!item) return;
        setMenu(false);
        goToPage(Number(item.dataset.page));
    });

    window.addEventListener('keydown', (e) => {
        if (menuIsOpen()) {
            if (e.key === 'Escape') setMenu(false);
            return;
        }
        if (e.key === 'ArrowRight' || e.key === 'PageDown') next();
        else if (e.key === 'ArrowLeft' || e.key === 'PageUp') prev();
        else if (e.key === 'Home') flipTo(0);
        else if (e.key === 'End') flipTo(maxCurrent());
    });

    // ------------------------------------------------------------------
    // Kiosk behaviour: close the book after two idle minutes, keep the
    // screen awake, full screen on demand.
    // ------------------------------------------------------------------
    let idleTimer;
    const poke = () => {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => { setMenu(false); flipTo(0); }, IDLE_MS);
    };
    ['pointerdown', 'keydown'].forEach((ev) => window.addEventListener(ev, poke, { passive: true }));
    poke();

    let wakeLock = null;
    const keepAwake = async () => {
        if (wakeLock || !('wakeLock' in navigator)) return;
        try {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => { wakeLock = null; });
        } catch (err) { /* not allowed here; the kiosk OS handles screen sleep */ }
    };
    window.addEventListener('pointerdown', keepAwake, { once: true });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });

    const fsBtn = $('fs-btn');
    fsBtn.addEventListener('click', async () => {
        try {
            if (document.fullscreenElement) await document.exitFullscreen();
            else await document.documentElement.requestFullscreen();
        } catch (err) { /* full screen isn't available on this device */ }
    });
    document.addEventListener('fullscreenchange', () => {
        const on = Boolean(document.fullscreenElement);
        fsBtn.innerHTML = svg(on ? ICON.shrink : ICON.expand);
        fsBtn.setAttribute('aria-label', on ? 'Exit full screen' : 'Enter full screen');
    });

    // Sound on/off, remembered on this kiosk. Turning it on plays a page
    // turn so staff can hear the volume straight away.
    const soundBtn = $('sound-btn');
    const paintSoundButton = () => {
        const on = pageSound.enabled;
        soundBtn.innerHTML = svg(on ? ICON.soundOn : ICON.soundOff);
        soundBtn.setAttribute('aria-label', on ? 'Turn page sound off' : 'Turn page sound on');
        soundBtn.setAttribute('aria-pressed', String(on));
    };
    soundBtn.addEventListener('click', () => {
        pageSound.setEnabled(!pageSound.enabled);
        paintSoundButton();
        if (pageSound.enabled) pageSound.flip();
    });
    paintSoundButton();
    // the light version has no page sound, so it never starts the audio engine
    const unlockSound = () => { if (!lite) pageSound.unlock(); };
    window.addEventListener('pointerdown', unlockSound, { once: true });
    window.addEventListener('keydown', unlockSound, { once: true });

    // ------------------------------------------------------------------
    // Light / 3D switch. The version changes in place, without reloading
    // the page: the open page stays open, and a kiosk in full screen stays
    // in full screen.
    // ------------------------------------------------------------------
    const paintVersion = () => {
        $('mode-light').setAttribute('aria-pressed', String(lite));
        $('mode-3d').setAttribute('aria-pressed', String(!lite));
    };
    const chooseVersion = (wantLight) => {
        if (wantLight === lite) return;
        try { localStorage.setItem('cc-version', wantLight ? 'light' : '3d'); } catch (err) { /* this visit only */ }
        // a ?lite= left in the address would undo the choice on the next visit
        const url = new URL(window.location.href);
        if (url.searchParams.has('lite')) {
            url.searchParams.delete('lite');
            window.history.replaceState(null, '', url);
        }
        // stop a page turn that is still under way
        stepTimers.forEach(clearTimeout);
        stepTimers.length = 0;
        pending = 0;
        turning.clear();

        lite = wantLight;
        document.documentElement.classList.toggle('lite', lite);
        paintVersion();
        book.classList.add('is-jumping');
        render();
        void book.offsetWidth; // put the leaves in place without turning them
        book.classList.remove('is-jumping');
        if (lite) {
            // let go of what only the 3D version uses
            canvas.width = 0;
            canvas.height = 0;
            points = [];
            pageSound.release();
        } else {
            startField();
            pageSound.unlock();
        }
    };
    paintVersion();
    $('mode-light').addEventListener('click', () => chooseVersion(true));
    $('mode-3d').addEventListener('click', () => chooseVersion(false));

    // ------------------------------------------------------------------
    // Theme: follows the device until someone picks one, then remembers it.
    // ------------------------------------------------------------------
    const root = document.documentElement;
    const themeBtn = $('theme-btn');
    const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
    const isDark = () => (root.dataset.theme ? root.dataset.theme === 'dark' : darkQuery.matches);
    const paintThemeButton = () => {
        const dark = isDark();
        themeBtn.innerHTML = svg(dark ? ICON.sun : ICON.moon);
        themeBtn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
    };
    try {
        const saved = localStorage.getItem('cc-theme');
        if (saved === 'dark' || saved === 'light') root.dataset.theme = saved;
    } catch (err) { /* storage unavailable: follow the device */ }
    themeBtn.addEventListener('click', () => {
        root.dataset.theme = isDark() ? 'light' : 'dark';
        try { localStorage.setItem('cc-theme', root.dataset.theme); } catch (err) { /* ignore */ }
        paintThemeButton();
        readFieldColor();
    });
    darkQuery.addEventListener('change', () => { paintThemeButton(); readFieldColor(); });
    paintThemeButton();

    // ------------------------------------------------------------------
    // Ambient field: drifting points joined by faint lines, like a
    // molecular model. Drawn in canvas so it stays cheap on kiosk GPUs.
    // ------------------------------------------------------------------
    const canvas = $('field');
    const ctx = canvas.getContext('2d');
    let points = [];
    let fieldColor = '255, 255, 255';

    function readFieldColor() {
        const probe = getComputedStyle(root).getPropertyValue('--field').trim();
        const m = probe.match(/^#([0-9a-f]{6})$/i);
        if (m) {
            const v = parseInt(m[1], 16);
            fieldColor = `${(v >> 16) & 255}, ${(v >> 8) & 255}, ${v & 255}`;
        }
        if (reduceMotion) drawField();
    }

    function sizeField() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = canvas.clientWidth * dpr;
        canvas.height = canvas.clientHeight * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const count = Math.round(Math.min(80, (canvas.clientWidth * canvas.clientHeight) / 22000));
        points = Array.from({ length: count }, () => ({
            x: Math.random() * canvas.clientWidth,
            y: Math.random() * canvas.clientHeight,
            vx: (Math.random() - 0.5) * 0.18,
            vy: -0.08 - Math.random() * 0.22,
            r: 0.8 + Math.random() * 1.8,
        }));
    }

    function drawField() {
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        ctx.clearRect(0, 0, w, h);
        for (let i = 0; i < points.length; i++) {
            const a = points[i];
            for (let j = i + 1; j < points.length; j++) {
                const b = points[j];
                const d = Math.hypot(a.x - b.x, a.y - b.y);
                if (d < 130) {
                    ctx.strokeStyle = `rgba(${fieldColor}, ${0.16 * (1 - d / 130)})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(a.x, a.y);
                    ctx.lineTo(b.x, b.y);
                    ctx.stroke();
                }
            }
        }
        for (const p of points) {
            ctx.fillStyle = `rgba(${fieldColor}, 0.7)`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    let fieldRunning = false;
    function tick() {
        // the light version has no particle background: the loop ends itself
        if (lite) {
            fieldRunning = false;
            return;
        }
        if (!document.hidden) {
            const w = canvas.clientWidth;
            const h = canvas.clientHeight;
            for (const p of points) {
                p.x += p.vx;
                p.y += p.vy;
                if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
                if (p.x < -10) p.x = w + 10;
                if (p.x > w + 10) p.x = -10;
            }
            drawField();
        }
        requestAnimationFrame(tick);
    }

    // ------------------------------------------------------------------
    // Boot
    // ------------------------------------------------------------------
    // Sizes the particle background and sets it moving (3D version only).
    function startField() {
        sizeField();
        readFieldColor();
        if (reduceMotion) {
            drawField();
        } else if (!fieldRunning) {
            fieldRunning = true;
            requestAnimationFrame(tick);
        }
    }

    layout();
    if (!lite) startField();

    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            layout();
            if (lite) return;
            sizeField();
            if (reduceMotion) drawField();
        }, 120);
    });
})();
</script>
</body>
</html>
