<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DOST IX Citizen's Charter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Instrument+Sans:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Layout: one floating instrument-grade book on a calibration-grid bench;
   chrome is a thin top bar and a bottom dock, the book owns the stage. */
:root {
    /* Colours of the DOST IX office poster: white running into azure,
       royal blue and navy; navy boxes with yellow titles and white text.
       Light mode is the top of the poster: white pages on the gradient. */
    --ground: #cfe6fb;
    --stage: linear-gradient(165deg, #ffffff 0%, #eaf4ff 16%, #8ccbf8 38%, #1492ec 58%, #0268f1 76%, #053cae 90%, #062a86 100%);
    --waves: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 900' preserveAspectRatio='none' fill='none' stroke='white'><path stroke-opacity='.20' stroke-width='2' d='M-40 640C260 470 560 800 900 590S1420 330 1640 470'/><path stroke-opacity='.16' stroke-width='1.5' d='M-40 700C280 540 600 850 950 650S1440 410 1640 540'/><path stroke-opacity='.12' stroke-width='1.5' d='M-40 760C300 620 640 900 1000 720S1460 500 1640 610'/><path stroke-opacity='.10' stroke-width='3' d='M-40 830C320 710 680 940 1050 790S1480 590 1640 690'/><path stroke-opacity='.16' stroke-width='1.5' d='M820 -20C960 130 1220 60 1640 250'/><path stroke-opacity='.10' stroke-width='2.5' d='M980 -20C1100 90 1320 40 1640 170'/></svg>");
    --paper: #ffffff;
    --paper-2: #f1f7ff;
    --ink: #0c1550;
    --ink-soft: #46507e;
    --line: rgba(12, 21, 80, 0.14);
    --brand: #0268f1;
    --accent: #0456c8;
    --accent-soft: rgba(2, 104, 241, 0.08);
    --accent-line: rgba(2, 104, 241, 0.32);
    --signal: #1aa3f5;
    --no: #c62828;
    --on-accent: #ffffff;
    --head-bg: #05409a;
    --head-ink: #ffffff;
    --box-bg: linear-gradient(135deg, #0a55c4, #042e8c);
    --glow: rgba(2, 104, 241, 0.28);
    --shadow: rgba(3, 20, 80, 0.32);
    --grid: rgba(255, 255, 255, 0.3);
    --field: #ffffff;
    --edge-a: #d3e2f6;
    --edge-b: #ffffff;
    --spine: rgba(6, 20, 90, 0.18);
    --sheen: rgba(255, 255, 255, 0.8);
    --glass: rgba(255, 255, 255, 0.72);
    --glass-line: rgba(12, 21, 80, 0.14);
    --scrim: rgba(4, 16, 70, 0.45);
    --menu-bg: rgba(255, 255, 255, 0.97);

    /* the poster's yellow on navy, the white text of the bottom bar (the
       gradient is always dark down there), and the cover, which runs from
       azure to navy with a yellow title. Dark mode keeps the yellow and
       white and turns the blues, cover included, to indigo. */
    --cta: #ffe81a;
    --on-cta: #0a1a6e;
    --box-title: #ffe81a;
    --box-ink: #ffffff;
    --dock-ink: #ffffff;
    --dock-soft: rgba(255, 255, 255, 0.82);
    --dock-line: rgba(255, 255, 255, 0.28);
    --cover-hi: #5cc0fb;
    --cover-a: #0a84e8;
    --cover-b: #0258d6;
    --cover-c: #04257e;
    --foil: #ffe81a;
    --foil-2: #ffc400;
    --foil-rgb: 255, 255, 255;
    --foil-ink: #ffffff;
    --foil-soft: #e2eeff;

    --f-display: 'Unbounded', 'Segoe UI', system-ui, sans-serif;
    --f-body: 'Instrument Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --f-mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;

    --flip: 950ms;
    --ease: cubic-bezier(0.645, 0.045, 0.355, 1);
}

@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --ground: #312e81;
        --stage: linear-gradient(165deg, #5b52ee 0%, #4338ca 26%, #312e81 54%, #221e63 80%, #14113d 100%);
        --paper: #2b2778;
        --paper-2: #221f63;
        --ink: #ffffff;
        --ink-soft: #cfcbf7;
        --line: rgba(255, 255, 255, 0.18);
        --brand: #ffe81a;
        --accent: #ffe81a;
        --accent-soft: rgba(255, 255, 255, 0.08);
        --accent-line: rgba(255, 255, 255, 0.32);
        --signal: #ffffff;
        --no: #ffa39a;
        --on-accent: #1e1b4b;
        --on-cta: #1e1b4b;
        --head-bg: #46419a;
        --head-ink: #f1f0ff;
        --box-bg: linear-gradient(135deg, #4a45a2, #3b3786);
        --glow: rgba(129, 120, 255, 0.38);
        --shadow: rgba(8, 5, 40, 0.6);
        --grid: rgba(170, 164, 255, 0.24);
        --field: #c4beff;
        --edge-a: #19164d;
        --edge-b: #4a43b8;
        --spine: rgba(8, 5, 40, 0.5);
        --sheen: rgba(195, 190, 255, 0.22);
        --glass: rgba(255, 255, 255, 0.1);
        --glass-line: rgba(255, 255, 255, 0.24);
        --scrim: rgba(10, 7, 45, 0.62);
        --menu-bg: rgba(31, 27, 94, 0.97);
        --cover-hi: #8f88ff;
        --cover-a: #5d54f0;
        --cover-b: #4338ca;
        --cover-c: #1e1b4b;
        --foil-soft: #e6e3ff;
        color-scheme: dark;
    }
}
:root[data-theme="dark"] {
    --ground: #312e81;
    --stage: linear-gradient(165deg, #5b52ee 0%, #4338ca 26%, #312e81 54%, #221e63 80%, #14113d 100%);
    --paper: #2b2778;
    --paper-2: #221f63;
    --ink: #ffffff;
    --ink-soft: #cfcbf7;
    --line: rgba(255, 255, 255, 0.18);
    --brand: #ffe81a;
    --accent: #ffe81a;
    --accent-soft: rgba(255, 255, 255, 0.08);
    --accent-line: rgba(255, 255, 255, 0.32);
    --signal: #ffffff;
    --no: #ffa39a;
    --on-accent: #1e1b4b;
    --on-cta: #1e1b4b;
    --head-bg: #46419a;
    --head-ink: #f1f0ff;
    --box-bg: linear-gradient(135deg, #4a45a2, #3b3786);
    --glow: rgba(129, 120, 255, 0.38);
    --shadow: rgba(8, 5, 40, 0.6);
    --grid: rgba(170, 164, 255, 0.24);
    --field: #c4beff;
    --edge-a: #19164d;
    --edge-b: #4a43b8;
    --spine: rgba(8, 5, 40, 0.5);
    --sheen: rgba(195, 190, 255, 0.22);
    --glass: rgba(255, 255, 255, 0.1);
    --glass-line: rgba(255, 255, 255, 0.24);
    --scrim: rgba(10, 7, 45, 0.62);
    --menu-bg: rgba(31, 27, 94, 0.97);
    --cover-hi: #8f88ff;
    --cover-a: #5d54f0;
    --cover-b: #4338ca;
    --cover-c: #1e1b4b;
    --foil-soft: #e6e3ff;
    color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--f-body);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    transition: background-color 0.5s ease, color 0.5s ease;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
svg.i { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

/* ---------- atmosphere ---------- */
.app {
    position: relative;
    height: 100%;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    padding-inline: max(16px, env(safe-area-inset-left, 0px));
    background: var(--waves) center / 100% 100% no-repeat, var(--stage);
}
.field {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}
.floor {
    position: absolute;
    left: -50%;
    right: -50%;
    bottom: -4%;
    height: 46%;
    pointer-events: none;
    background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 64px 64px;
    transform: perspective(700px) rotateX(64deg);
    transform-origin: 50% 100%;
    -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 85%);
    mask-image: linear-gradient(to top, #000 0%, transparent 85%);
    animation: floor 14s linear infinite;
}
@keyframes floor { to { background-position: 0 64px, 0 0; } }

/* ---------- top bar ---------- */
.bar {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-block: max(14px, env(safe-area-inset-top, 0px)) 10px;
}
.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    text-align: left;
}
.brand img {
    width: 46px;
    height: 46px;
    filter: drop-shadow(0 0 7px var(--glow));
}
.brand-top {
    display: block;
    font-family: var(--f-mono);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
}
.brand-name {
    display: block;
    font-family: var(--f-display);
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.01em;
}
.bar-actions { display: flex; gap: 10px; }
.pill, .round {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 52px;
    border: 1px solid var(--glass-line);
    border-radius: 999px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s ease, border-color 0.2s ease;
}
.pill { padding: 0 20px; font-size: 1rem; }
.round { width: 52px; font-size: 1.25rem; }
.pill:active, .round:active { transform: scale(0.95); border-color: var(--brand); }
/* the Light / 3D switch: two options, the one in use filled in */
.mode {
    display: inline-flex;
    height: 52px;
    padding: 4px;
    border: 1px solid var(--glass-line);
    border-radius: 999px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
}
.mode-opt {
    min-width: 44px;
    padding: 0 16px;
    border: 0;
    border-radius: 999px;
    background: none;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
}
.mode-opt[aria-pressed="true"] { background: var(--cta); color: var(--on-cta); cursor: default; }

/* ---------- the book ---------- */
.stage {
    position: relative;
    z-index: 1;
    display: grid;
    /* one column as wide as the stage, so a book wider than the screen
       (single-page mode on a portrait kiosk) is centred, not left-aligned */
    grid-template-columns: minmax(0, 1fr);
    place-items: center;
    min-height: 0;
    overflow: hidden;
    touch-action: none;
}
.book-wrap {
    position: relative;
    flex-shrink: 0;
    width: calc(var(--page-w, 300px) * 2);
    height: calc(var(--page-w, 300px) / var(--page-ratio, 0.9));
    transition: transform var(--flip) var(--ease);
}
.book {
    position: absolute;
    inset: 0;
    perspective: 2600px;
    animation: hover 9s ease-in-out infinite;
}
@keyframes hover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

.leaf {
    position: absolute;
    top: 0;
    left: 50%;
    width: 50%;
    height: 100%;
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform var(--flip) var(--ease);
    will-change: transform;
}
.leaf.flipped { transform: rotateY(-180deg); }
/* a long jump moves the skipped leaves at once, without turning them */
.book.is-jumping .leaf { transition: none; }
/* Leaves buried in either stack are not drawn at all: a thick book would
   otherwise keep every page painted at once and run the browser out of
   drawing memory, letting other pages show through the open one. */
.leaf.is-away { visibility: hidden; will-change: auto; }

.face {
    position: absolute;
    inset: 0;
    overflow: hidden;
    container-type: size;
    /* Page content is measured against the page's height, not its width,
       so widening the book for a kiosk adds room instead of growing the
       text until it runs off the bottom. 0.71cqh is one hundredth of the
       width an A4-shaped page would have at this height. */
    --u: 0.71cqh;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    background: linear-gradient(160deg, var(--paper), var(--paper-2));
    box-shadow: 0 0 0 1px var(--line);
}
/* Only the pages on screen cast a shadow; giving all sixteen stacked
   leaves one piles them up into a dark slab around the book. */
.face.is-shown { box-shadow: 0 0 0 1px var(--line), 0 14px 34px var(--shadow); }
.face.front { border-radius: 3px 12px 12px 3px; }
.face.back { transform: rotateY(180deg); border-radius: 12px 3px 3px 12px; }

/* gutter shading where the page meets the spine */
.face::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
}
.face.front::after { background: linear-gradient(90deg, var(--spine) 0%, transparent 8%); }
.face.back::after { background: linear-gradient(270deg, var(--spine) 0%, transparent 8%); }

/* a light sweep across the page while it turns */
.leaf.turning .face::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    background: linear-gradient(105deg, transparent 30%, var(--sheen) 50%, transparent 70%);
    background-size: 260% 100%;
    animation: sheen var(--flip) ease-in-out;
}
.leaf.turning .face { box-shadow: 0 0 0 1px var(--line), 0 30px 60px var(--shadow); }
@keyframes sheen { from { background-position: 120% 0; } to { background-position: -20% 0; } }

/* page-block thickness that shrinks/grows as you read */
.depth {
    position: absolute;
    top: 1.4%;
    bottom: 1.4%;
    z-index: 0;
    pointer-events: none;
    border-radius: 2px;
    background: repeating-linear-gradient(90deg, var(--edge-a) 0 1px, var(--edge-b) 1px 2px);
    box-shadow: 0 10px 24px var(--shadow);
    transition: width var(--flip) var(--ease);
}
.depth-r { left: calc(100% - 2px); width: calc(var(--rd, 1) * 14px); }
.depth-l { right: calc(100% - 2px); width: calc(var(--ld, 0) * 14px); }
.is-single .depth-l { display: none; }

.floor-shadow {
    position: absolute;
    left: 8%;
    right: 8%;
    bottom: -7%;
    height: 9%;
    pointer-events: none;
    background: radial-gradient(ellipse at center, var(--glow), transparent 70%);
    transition: left var(--flip) var(--ease), right var(--flip) var(--ease);
}
.is-closed-front .floor-shadow, .is-single .floor-shadow { left: 54%; }
.is-closed-back .floor-shadow { right: 54%; }

/* ---------- dock ---------- */
.dock {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: clamp(12px, 2.4vw, 28px);
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding-block: 10px max(18px, env(safe-area-inset-bottom, 0px));
    color: var(--dock-ink);
}
.nav {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 60px;
    padding: 0 26px;
    border: 0;
    border-radius: 999px;
    background: var(--cta);
    color: var(--on-cta);
    font-size: 1.05rem;
    font-weight: 700;
    box-shadow: 0 8px 26px var(--shadow);
    cursor: pointer;
    transition: transform 0.2s ease, opacity 0.3s ease;
}
.nav:active { transform: scale(0.95); }
.nav:disabled { opacity: 0.3; cursor: default; box-shadow: none; }
.meter { min-width: 0; }
.meter-text {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
}
#meter-title {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 700;
    font-size: 1rem;
}
#meter-sub {
    flex-shrink: 0;
    font-family: var(--f-mono);
    font-size: 0.8rem;
    color: var(--dock-soft);
    font-variant-numeric: tabular-nums;
}
.meter-track {
    height: 6px;
    margin-top: 10px;
    overflow: hidden;
    border-radius: 99px;
    background: var(--dock-line);
}
.meter-fill {
    height: 100%;
    width: 0;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--cta), #ffffff);
    box-shadow: 0 0 12px rgba(255, 232, 26, 0.5);
    transition: width 0.7s var(--ease);
}

@media (max-width: 640px) {
    .nav span, .pill span, .brand-top { display: none; }
    .nav { padding: 0 20px; }
    .pill { width: 52px; padding: 0; }
}
@media (max-width: 480px) {
    .brand-name { display: none; }
    .bar-actions { gap: 8px; }
    /* room for the Light / 3D switch on a phone */
    .pill, .round { width: 44px; height: 44px; }
    .mode { height: 44px; padding: 3px; }
    .mode-opt { min-width: 38px; padding: 0 10px; font-size: 0.82rem; }
    #fs-btn { display: none; }
}

/* =====================================================================
   PAGE CONTENT — sizes are in --u (scaled to page height), so a page reads the same
   on a 13" kiosk and a 55" portrait totem.
   ===================================================================== */
.pg {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: calc(12 * var(--u)) calc(9 * var(--u)) calc(11 * var(--u));
    font-size: calc(3.3 * var(--u));
    line-height: 1.5;
    color: var(--ink);
}
/* running head: a document convention, it tells you where you are */
.run {
    position: absolute;
    top: calc(5 * var(--u));
    left: calc(9 * var(--u));
    right: calc(9 * var(--u));
    display: flex;
    justify-content: space-between;
    gap: calc(2 * var(--u));
    padding-bottom: calc(1.6 * var(--u));
    border-bottom: 1px solid var(--line);
    font-family: var(--f-mono);
    font-size: calc(2 * var(--u));
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
}
.run span:last-child { color: var(--accent); }
/* calibrated outer margin, like the scale on a lab instrument */
.ruler {
    position: absolute;
    top: calc(14 * var(--u));
    bottom: calc(12 * var(--u));
    width: calc(2.6 * var(--u));
    opacity: 0.5;
    pointer-events: none;
    background-image:
        repeating-linear-gradient(to bottom, var(--ink-soft) 0 1px, transparent 1px calc(7.5 * var(--u))),
        repeating-linear-gradient(to bottom, var(--ink-soft) 0 1px, transparent 1px calc(1.5 * var(--u)));
    background-size: calc(2.6 * var(--u)) 100%, calc(1.3 * var(--u)) 100%;
    background-repeat: no-repeat;
}
.ruler.on-right { right: calc(2.4 * var(--u)); background-position: right top, right top; }
.ruler.on-left { left: calc(2.4 * var(--u)); background-position: left top, left top; }
.folio {
    position: absolute;
    bottom: calc(5 * var(--u));
    font-family: var(--f-mono);
    font-size: calc(2.2 * var(--u));
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
}
.folio.on-right { right: calc(9 * var(--u)); }
.folio.on-left { left: calc(9 * var(--u)); }

.kicker {
    display: flex;
    align-items: center;
    gap: calc(1.6 * var(--u));
    margin: 0 0 calc(2.4 * var(--u));
    font-family: var(--f-mono);
    font-size: calc(2.4 * var(--u));
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
}
.title {
    margin: 0;
    font-family: var(--f-display);
    font-size: calc(6.4 * var(--u));
    font-weight: 700;
    line-height: 1.12;
    letter-spacing: -0.01em;
    text-wrap: balance;
}
.rule {
    flex-shrink: 0;
    width: calc(14 * var(--u));
    height: calc(0.6 * var(--u));
    margin: calc(3.6 * var(--u)) 0 calc(4 * var(--u));
    border-radius: 99px;
    background: linear-gradient(90deg, var(--brand), var(--signal));
    box-shadow: 0 0 calc(2.4 * var(--u)) var(--glow);
}
.body { margin: 0 0 calc(3 * var(--u)); color: var(--ink-soft); }
.label {
    margin: calc(1.4 * var(--u)) 0 calc(2.2 * var(--u));
    font-family: var(--f-mono);
    font-size: calc(2.2 * var(--u));
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
}
.law {
    display: block;
    margin-bottom: calc(3.4 * var(--u));
    padding: calc(2.4 * var(--u)) calc(3 * var(--u));
    border-left: calc(0.6 * var(--u)) solid var(--brand);
    background: var(--accent-soft);
    font-size: calc(3 * var(--u));
    line-height: 1.45;
}
.law b { font-family: var(--f-mono); font-weight: 600; color: var(--accent); }

.howto { display: grid; gap: calc(2 * var(--u)); margin: 0; padding: 0; list-style: none; }
.howto li {
    display: flex;
    align-items: center;
    gap: calc(2.6 * var(--u));

}

    color: var(--accent);
}
.ls-office {

/* programs and service pages (from the printed charter) */
.prog {

    border-radius: calc(2.4 * var(--u));

}
.prog-num { font-family: var(--f-display); font-size: calc(4 * var(--u)); font-weight: 700; line-height: 1.2; color: var(--box-ink); }
.prog-name { margin: 0 0 calc(1.6 * var(--u)); font-family: var(--f-display); font-size: calc(4 * var(--u)); font-weight: 700; line-height: 1.2; text-wrap: balance; color: var(--box-title); }

/* a long program description plus a long list of services */

.is-dense .prog-list { gap: calc(0.8 * var(--u)); font-size: calc(2.6 * var(--u)); }
.prog-list { display: grid; gap: calc(1.2 * var(--u)); margin: 0; padding: 0; list-style: none; font-size: calc(2.9 * var(--u)); font-weight: 600; }
.prog-list li { display: flex; gap: calc(1.6 * var(--u)); }
.prog-list span { flex-shrink: 0; min-width: 3.4ch; font-family: var(--f-mono); color: var(--accent); }

.pg-svc > * { flex-shrink: 0; }
.svc-check td { padding-block: calc(0.5 * var(--u)); font-size: calc(2.05 * var(--u)); line-height: 1.26; }
.pg-svc { padding-top: calc(10.5 * var(--u)); padding-bottom: calc(8 * var(--u)); font-size: calc(2.2 * var(--u)); line-height: 1.3; overflow: hidden; }
.svc-prog { margin: 0 0 calc(0.8 * var(--u)); font-family: var(--f-mono); font-size: calc(2 * var(--u)); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.svc-prog i { text-transform: none; color: var(--ink-soft); }
.svc-title { display: flex; gap: calc(1.4 * var(--u)); margin: 0 0 calc(2 * var(--u)); font-family: var(--f-display); font-size: calc(3.8 * var(--u)); font-weight: 700; line-height: 1.15; }
.svc-title span { color: var(--accent); }

}

.svc-info dd { color: var(--ink-soft); }

.pg-svc table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.pg-svc th, .pg-svc td { padding: calc(0.8 * var(--u)) calc(1 * var(--u)); border: 1px solid var(--line); vertical-align: top; text-align: left; }

}

.svc-check { margin-bottom: calc(1.6 * var(--u)); }

.svc-check tr.is-sub td:first-child { padding-left: calc(3.6 * var(--u)); }

.svc-info dd.is-flush { padding: 0; }

.svc-matrix th.is-c { width: 17%; padding-inline: calc(0.4 * var(--u)); letter-spacing: 0; }

.svc-check td:last-child { text-align: left; }
.svc-steps .c-client { width: 17%; }
.svc-steps .c-action { width: 33%; }

.svc-steps .c-person { width: 32%; }
.svc-steps td { color: var(--ink-soft); }

.svc-n { margin-right: calc(0.8 * var(--u)); font-family: var(--f-mono); font-size: 0.9em; font-weight: 600; color: var(--accent); }
.svc-act { display: flex; margin-bottom: calc(0.6 * var(--u)); }

.svc-act.is-label { display: block; font-style: italic; color: var(--ink); }
.svc-steps.is-grid .svc-act { margin-bottom: 0; }
.svc-steps.is-grid .svc-act + .svc-act { margin-top: calc(0.8 * var(--u)); }
.svc-lead { display: block; margin-bottom: calc(0.6 * var(--u)); font-weight: 600; color: var(--ink); }
.svc-dots { margin: calc(0.5 * var(--u)) 0 0; padding-left: calc(2.6 * var(--u)); list-style: disc; }
.svc-dots li::marker { color: var(--accent); }
.svc-dots li + li { margin-top: calc(0.4 * var(--u)); }
.svc-dots.is-i { font-style: italic; }

.svc-note { display: block; margin-top: calc(1 * var(--u)); font-style: italic; }

/* feedback and complaints mechanism, list of offices */
.pg-fcm { font-size: calc(2.35 * var(--u)); line-height: 1.36; }
.pg-fcm td { color: var(--ink-soft); }

.fcm-sub {
    margin: calc(2.6 * var(--u)) 0 calc(1.4 * var(--u));
    font-family: var(--f-display);
    font-size: calc(3 * var(--u));
    font-weight: 700;
}
.fcm-offices th:nth-child(1) { width: 32%; }
.fcm-offices th:nth-child(3) { width: 30%; }
.svc-steps tr.is-cont td { border-top-style: dashed; }
.svc-act .svc-n { flex-shrink: 0; min-width: calc(3.6 * var(--u)); }
.svc-more { font-weight: 400; font-style: italic; color: var(--ink-soft); }
.svc-total td { white-space: nowrap; }
.svc-total td { font-family: var(--f-mono); font-weight: 700; color: var(--accent); background: var(--accent-soft); }
.staff { display: grid; grid-template-columns: 1fr; gap: calc(1.2 * var(--u)) calc(1.4 * var(--u)); font-size: calc(1.85 * var(--u)); line-height: 1.28; }
.staff-group { display: flex; flex-direction: column; min-width: 0; }

.staff-group em { font-style: normal; color: var(--ink-soft); opacity: 0.85; }

/* office and program opening pages */
.pg-section { overflow: hidden; }
.sec-title { font-size: calc(7 * var(--u)); }

/* feedback */
.pg-center { align-items: center; justify-content: center; text-align: center; }
.pg-center .rule { margin-inline: auto; }
.orb {
    position: relative;
    display: grid;
    place-items: center;
    width: calc(24 * var(--u));
    height: calc(24 * var(--u));
    margin-bottom: calc(6 * var(--u));
    border-radius: 50%;
    background: var(--brand);
    color: var(--on-accent);
    box-shadow: 0 0 calc(8 * var(--u)) var(--glow);
}
.orb svg { width: calc(11 * var(--u)); height: calc(11 * var(--u)); }
.orb::before, .orb::after {
    content: '';
    position: absolute;
    inset: calc(-3 * var(--u));
    border: calc(0.35 * var(--u)) solid var(--brand);
    border-radius: 50%;
    opacity: 0;
    animation: ring 3s ease-out infinite;
}

@keyframes ring { 0% { transform: scale(0.85); opacity: 0.7; } 100% { transform: scale(1.35); opacity: 0; } }
.pg-center .body { max-width: calc(62 * var(--u)); }
.counter {
    margin-top: calc(2 * var(--u));
    padding: calc(2.6 * var(--u)) calc(4 * var(--u));
    border: 1px dashed var(--accent-line);
    border-radius: calc(2.6 * var(--u));
    font-family: var(--f-mono);
    font-size: calc(2.5 * var(--u));
    letter-spacing: 0.08em;
    color: var(--accent);
}

/* covers */
.pg-cover {
    align-items: center;
    justify-content: center;
    padding: calc(9 * var(--u)) calc(8 * var(--u));
    overflow: hidden;
    text-align: center;
    color: var(--foil-ink);
    background:
        radial-gradient(110% 70% at 8% 0%, var(--cover-hi) 0%, transparent 60%),
        linear-gradient(165deg, var(--cover-a) 0%, var(--cover-b) 48%, var(--cover-c) 100%);
}
.pg-cover::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(rgba(var(--foil-rgb), 0.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(var(--foil-rgb), 0.09) 1px, transparent 1px);
    background-size: calc(6 * var(--u)) calc(6 * var(--u));
    -webkit-mask-image: radial-gradient(circle at 50% 40%, #000, transparent 75%);
    mask-image: radial-gradient(circle at 50% 40%, #000, transparent 75%);
}
.holo {
    position: absolute;
    inset: -40%;
    pointer-events: none;
    opacity: 0.5;
    /* no mix-blend-mode: Firefox draws a turning leaf mirrored when one of
       its pages holds a blended layer. The sweep is white, which looks the
       same blended normally as it did with "screen". */
    background: conic-gradient(from 0deg,
        transparent 0 20%, rgba(var(--foil-rgb), 0.35) 25%, transparent 32%,
        rgba(255, 255, 255, 0.22) 55%, transparent 62%,
        rgba(var(--foil-rgb), 0.25) 80%, transparent 88%);

}
.seal {
    position: relative;
    display: grid;
    place-items: center;
    width: calc(30 * var(--u));
    height: calc(30 * var(--u));
    margin-bottom: calc(7 * var(--u));
    border-radius: 50%;
}

    content: '';
    position: absolute;
    inset: calc(-4 * var(--u));

    border-radius: 50%;
    animation: spin 34s linear infinite;
}
.seal img { width: 92%; height: 92%; object-fit: contain; filter: drop-shadow(0 0 calc(3.5 * var(--u)) rgba(var(--foil-rgb), 0.5)); }
.seal.is-small { width: calc(22 * var(--u)); height: calc(22 * var(--u)); }
.cover-kicker {

}
.cover-hint svg { width: calc(4 * var(--u)); height: calc(4 * var(--u)); }
.back-office { position: relative; margin: 0; font-family: var(--f-display); font-size: calc(6.4 * var(--u)); font-weight: 700; }
.back-thanks { position: relative; margin: calc(8 * var(--u)) 0 0; font-size: calc(3.3 * var(--u)); font-weight: 600; color: var(--foil-soft); }

@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- side menu: the book's contents ---------- */

    position: fixed;

    transition: opacity 0.35s ease;
}

    position: fixed;
    inset: 0 auto 0 0;
    z-index: 10;

    width: min(500px, 90vw);
    padding-left: env(safe-area-inset-left, 0px);
    border-right: 1px solid var(--glass-line);
    background: var(--menu-bg);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    box-shadow: 30px 0 70px var(--shadow);
    transform: translateX(-104%);
    visibility: hidden;
    transition: transform 0.45s var(--ease), visibility 0s linear 0.45s;
}
.menu-open .menu { transform: none; visibility: visible; transition: transform 0.45s var(--ease); }
.menu-open .menu-scrim { opacity: 1; pointer-events: auto; }
.menu-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: max(18px, env(safe-area-inset-top, 0px)) 18px 16px 26px;
    border-bottom: 1px solid var(--line);
}
.menu-kicker {
    display: block;
    font-family: var(--f-mono);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
}
.menu-title { margin: 4px 0 0; font-family: var(--f-display); font-size: 1.5rem; font-weight: 700; line-height: 1.1; }
.menu-list {
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 10px 14px max(24px, env(safe-area-inset-bottom, 0px));
    scrollbar-width: thin;
    scrollbar-color: var(--accent-line) transparent;
}
.menu-group {
    margin: 16px 0 6px;
    padding: 18px 12px 0;
    border-top: 1px solid var(--line);
    font-family: var(--f-mono);
    font-size: 0.74rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
}
/* rows are at least 46px tall: they are tapped with a finger on the kiosk */
.menu-item {
    display: flex;
    align-items: baseline;
    gap: 10px;
    width: 100%;
    min-height: 52px;
    padding: 14px 12px;
    border: 0;
    border-radius: 12px;
    background: none;
    font-size: 1.02rem;
    font-weight: 700;
    line-height: 1.3;
    text-align: left;
    cursor: pointer;
}
.menu-item:focus-visible { outline-offset: -3px; }
.menu-num { flex-shrink: 0; min-width: 2.1em; font-family: var(--f-mono); font-size: 0.86em; font-weight: 600; color: var(--accent); }
.menu-name { flex: 1; min-width: 0; }
.menu-page { flex-shrink: 0; font-family: var(--f-mono); font-size: 0.78rem; font-weight: 500; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.menu-item.lvl-1 { padding-left: 24px; font-size: 0.97rem; font-weight: 600; }
.menu-item.lvl-2 { min-height: 46px; padding: 11px 12px 11px 60px; font-size: 0.92rem; font-weight: 500; color: var(--ink-soft); }
.menu-item:active { background: var(--accent-soft); }
.menu-item.is-here { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--brand); color: var(--ink); }
@media (hover: hover) { .menu-item:hover { background: var(--accent-soft); } }

/* The floor grid reaches past both sides of the screen. Unclipped, a phone
   lays the whole page out wider than its screen and shows it zoomed out. */
.app { overflow: hidden; }

/* ---------- light version ----------
   html.lite, chosen with the Light / 3D switch. Made so a phone with 2 GB
   of memory can run the book. The pages and what is on them are the same,
   but nothing is drawn in 3D: the open pages lie flat and a turn swaps
   them with a short fade. Also left out: the particle background, the
   floor grid, the wave lines, blur, glows, shadows, the decorations that
   never stop animating, and the page sound. The script keeps a page in
   the document only while it is on screen. */
.lite .field, .lite .floor, .lite .floor-shadow, .lite .holo, .lite #sound-btn { display: none; }
.lite .pg-cover::before { content: none; }
/* no wave lines */
.lite .app { background: var(--stage); }
.lite .seal::after, .lite .cover-hint, .lite .orb::before, .lite .orb::after { animation: none; }
.lite .pill, .lite .round, .lite .mode, .lite .menu { -webkit-backdrop-filter: none; backdrop-filter: none; }
.lite .brand img, .lite .seal img, .lite .cover-title { filter: none; }
.lite .nav, .lite .rule, .lite .meter-fill, .lite .menu { box-shadow: none; }
/* flat pages: every leaf stays on the right half of the book, and the back
   of a leaf is moved, not turned, onto the left half */
.lite .book { perspective: none; animation: none; }
.lite .book-wrap { transition: none; }
.lite .leaf, .lite .leaf.flipped { transform: none; transform-style: flat; transition: none; will-change: auto; }
.lite .face, .lite .face.is-shown { box-shadow: 0 0 0 1px var(--line); }
.lite .face { -webkit-backface-visibility: visible; backface-visibility: visible; visibility: hidden; }
.lite .face.back { transform: translateX(-100%); }
.lite .face.is-shown { visibility: visible; animation: page-in 0.2s ease-out; }
@keyframes page-in { from { opacity: 0.2; } }

@media (prefers-reduced-motion: reduce) {
    :root { --flip: 1ms; }
    .lite .face.is-shown { animation: none; }
    .menu, .menu-open .menu, .menu-scrim { transition: none; }
    .floor, .book, .holo, .seal::after, .cover-hint, .orb::before, .orb::after { animation: none; }
}
</style>
</head>

<script>
(() => {
    const IDLE_MS = 120000;
    const PAGE_RATIO = 0.9;
    const STEP_MS = 130;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // The book comes in two versions, chosen with the Light / 3D switch in
    // the top bar. The light one is made so a phone with 2 GB of memory can
    // run it (see the ".lite" styles). Until someone chooses, phones and
    // devices that report 2 GB or less get the light version and everything
    // else gets 3D. ?lite=1 or ?lite=0 in the address overrides both.
    let lite = (() => {
        const forced = new URLSearchParams(window.location.search).get('lite');
        if (forced === '1' || forced === '0') return forced === '1';
        let chosen = null;
        try { chosen = localStorage.getItem('cc-version'); } catch (err) { /* no storage: decide by device */ }
        if (chosen === 'light' || chosen === '3d') return chosen === 'light';
        if (navigator.deviceMemory && navigator.deviceMemory <= 2) return true;
        return Math.min(window.screen.width, window.screen.height) < 600;
    })();
    document.documentElement.classList.toggle('lite', lite);

    // ------------------------------------------------------------------
    // Page-turn sound, synthesized with Web Audio so there is no audio file
    // to ship and it works on an offline kiosk. A turn is three layers of
    // shaped noise: the paper swish as the page lifts, a crisp edge, and a
    // soft settle as it lands. Small random variation per turn keeps it
    // from sounding mechanical.
    // ------------------------------------------------------------------
    const pageSound = (() => {
        let ctx = null;
        let noise = null;
        let enabled = true;
        try { enabled = localStorage.getItem('cc-sound') !== 'off'; } catch (err) { /* default on */ }

        const ensure = () => {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return null;
            if (!ctx) {
                ctx = new AudioCtx();
                // One second of noise, part white and part smoothed, which
                // reads as paper texture rather than static hiss.
                noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
                const data = noise.getChannelData(0);
                let smooth = 0;
                for (let i = 0; i < data.length; i++) {
                    const white = Math.random() * 2 - 1;
                    smooth = (smooth + 0.02 * white) / 1.02;
                    data[i] = (white * 0.6 + smooth * 3.5) * 0.5;
                }
            }
            // Browsers only start audio after a touch or key press.
            if (ctx.state === 'suspended') ctx.resume().catch(() => {});
            return ctx;
        };

        const burst = (start, duration, type, fromHz, toHz, q, peak) => {
            const source = ctx.createBufferSource();
            source.buffer = noise;
            source.playbackRate.value = 0.9 + Math.random() * 0.2;
            const filter = ctx.createBiquadFilter();
            filter.type = type;
            filter.Q.value = q;
            filter.frequency.setValueAtTime(fromHz, start);
            filter.frequency.exponentialRampToValueAtTime(toHz, start + duration);
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(peak, start + duration * 0.25);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
            source.connect(filter).connect(gain).connect(ctx.destination);
            source.start(start, Math.random() * 0.3, duration + 0.05);
        };

        return {
            get enabled() { return enabled; },
            unlock: () => { if (enabled) ensure(); },
            setEnabled(on) {
                enabled = on;
                try { localStorage.setItem('cc-sound', on ? 'on' : 'off'); } catch (err) { /* ignore */ }
            },
            // lets go of the audio engine (the light version has no page sound)
            release() {
                if (ctx) ctx.close().catch(() => {});
                ctx = null;
                noise = null;
            },
            // quick: a page passing by during a multi-page jump
            flip(quick = false) {
                if (!enabled || !ensure()) return;
                const t = ctx.currentTime + 0.01;
                const level = quick ? 0.5 : 1;
                burst(t, quick ? 0.22 : 0.42, 'bandpass', 1300 + Math.random() * 500, 4200 + Math.random() * 900, 0.9, 0.35 * level);
                burst(t + 0.02, quick ? 0.15 : 0.3, 'highpass', 5000, 7200, 0.7, 0.08 * level);
                if (!quick) {
                    const land = Math.max(0.12, (FLIP_MS / 1000) * 0.75);
                    burst(t + land, 0.09, 'lowpass', 900, 380, 0.8, 0.22);
                }
            },
        };
    })();

    const listBlock = (b) => `

    const TOS_STAFF = [
        { office: 'CSTC-ZCIC', names: ['Ricardo J. Apolinario III', 'Ian C. Avenido'], cos: ['Merly D. Alivio', 'Gretchen D. Marangan', 'Jon Brett Madarang'] },

        { office: 'PSTO-ZDS', names: ['Christian Carl R. Resente', 'Sheryl F. Jovenal'], cos: ['Julienne B. Sagut'] },
        { office: 'PSTO-ZDN', names: ['Nuhman M. Aljani', 'Jelyn O. Bayonas', 'Herma Joyce T. Alburo', 'Joemar B. Anghag'], cos: ['Shiryll B. Garcia', 'Josef Kyle O. Lugo'] },

    const GIA_STAFF = [
        { office: 'CSTC-ZCIC', names: ['Ricardo J. Apolinario III', 'Ian C. Avenido'], cos: ['Charissa Mae Bait-it', 'Leojay E. Torres', 'Ardlee R. Natividad', 'Adzar A. Abdullah'] },
        { office: 'PSTO-ZSP', names: ['Jennifer A. Pidor', 'Jeyzel P. Aparri', 'Dores C. Gabo'], cos: ['Jerves Z. Dalde', 'Camille F. Camins'] },
        { office: 'PSTO-ZDS', names: ['Christian Carl R. Resente', 'Kristine Mae R. Sarita', 'Jan Melvin D. Vallejo'], cos: ['Alma Fe H. Albarico', 'Britney Myre O. Toledo'] },

    ];
    // As printed for step 1 of 6a, where PSTO-ZDS lists one COS only.
    const GIA_STAFF_6A1 = GIA_STAFF.map((g) => (g.office === 'PSTO-ZDS' ? { ...g, cos: g.cos.slice(0, 1) } : g));
    const GIA_RPMO = { office: 'RPMO', names: ['Ian C. Avenido'], cos: ['Sharmaine V. Morales', 'Roger Dave F. Gramatica', 'Rachel V. Rubio', 'Aigel A. Martinez'] };
    const RPMO_STAFF = { office: 'RPMO', names: ['Mary Grace A. Torres'], cos: ['Sharmaine V. Morales', 'Roger Dave F. Gramatica', 'Rachel V. Rubio', 'Aigel A. Martinez'] };
    const who = (office) => ({ office });

    // Printed alike on the Human Resource services.

    const SCHOLARSHIP_STAFF = ['\u2022 Sheila S. Bernardo and', '\u2022 Stenel Rizza Alegre-Guillermo', '\u2022 Zoren F. Antonio'];

    const rich = (v) => (v && typeof v === 'object' ? (v.h != null ? v.h : esc(v.t ?? '')) : esc(v ?? ''));
    // Shown as a web address but not clickable: the kiosk must stay on the book.
    const link = (url) => `<span class="svc-link">${esc(url)}</span>`;
    const numbered = (n, text) => ({ h: `<div class="svc-act"><span class="svc-n">${esc(n)}</span><span>${rich(text)}</span></div>` });
    // Bulleted list, and several rich pieces one after another.

    // Small yes/no comparison table for an info row ("Who may avail").
    const matrix = (head, rows, markWidth = 17) => ({

        h: `<table class="svc-matrix"><thead><tr>${head.map((x, i) => `<th${i ? ` class="is-c" style="width:${markWidth}%"` : ''}>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(([t, ...marks]) => `<tr><td>${rich(t)}</td>${marks.map((m) => `<td class="is-c ${m ? 'is-tick' : 'is-cross'}">${m ? '✓' : CROSS}</td>`).join('')}</tr>`).join('')}</tbody></table>`,
    });

    const itemNo = (html) => html.replace(/^(\d+\.(?:\d+\.?)*)\s+/, '<span class="svc-n">$1</span>');
    const checkTable = (list, from = 0, to) => `
        <table class="svc-check">
            <thead><tr><th${list.reqWidth ? ` style="width:${list.reqWidth}%"` : ''}>Checklist of requirements</th>${list.cols.map((c) => `<th class="is-c"${list.markWidth ? ` style="width:${list.markWidth}%"` : ''}>${esc(c)}</th>`).join('')}<th>Where to secure</th></tr></thead>
